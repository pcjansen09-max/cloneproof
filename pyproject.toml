[project]
name = "cloneproof"
version = "0.1.0"
description = "Measure how close a website clone really is to the original, and get the exact prompt that makes your AI agent fix the difference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.45", "pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
cloneproof = "cloneproof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloneproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
